stages:
  - lint
  - test

lint:gitleaks:
  stage: lint
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.21.2
    entrypoint: [""]
  script:
    - gitleaks detect --source . --config .gitleaks.toml --verbose --redact
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:rust:
  stage: test
  image: rust:1.88.0
  script:
    - cargo test --workspace --lib --bins
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:rust-integration:
  stage: test
  image: rust:1.88.0
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: voting
    POSTGRES_PASSWORD: voting
    POSTGRES_DB: voting_test_ci
    POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=trust"
    LEDGER_TEST_DATABASE_URL: postgres://voting:voting@postgres:5432/voting_test_ci
    LEDGER_TEST_ALLOW_DESTRUCTIVE: "1"
    LEDGER_TEST_REQUIRED: "1"
    LEDGER_TEST_ALLOW_CI_SERVICE: "1"
    VOTING_CONTRACT_CAPTURE_PATH: /tmp/voting-contracts.jsonl
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends pkg-config libssl-dev postgresql-client python3-venv
    - python3 -m venv /tmp/voting-validator
    - /tmp/voting-validator/bin/pip install --disable-pip-version-check -r scripts/requirements-verify.txt
    - |
      for i in $(seq 1 30); do
        pg_isready -h postgres -U voting -d voting_test_ci && break
        sleep 2
      done
    - PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres -U voting -d voting_test_ci -v ON_ERROR_STOP=1 -c "COMMENT ON DATABASE voting_test_ci IS 'cl8y-voting-ephemeral-test'"
  script:
    - cargo test --workspace --tests --jobs 1 -- --test-threads=1
    - /tmp/voting-validator/bin/python scripts/verify-api-contracts.py /tmp/voting-contracts.jsonl --require-success
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:frontend:
  stage: test
  image: node:22
  cache:
    key: frontend-npm
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci
    - npm exec patch-package
    - npm test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:frontend-spa-fallback:
  stage: test
  image: nginx:1.27-alpine
  script:
    - sh deploy/docker/test-frontend-spa-fallback.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
