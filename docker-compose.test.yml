# Local Postgres for `LEDGER_TEST_DATABASE_URL` (port 5433).
# `network_mode: host` + `PGPORT=5433` avoids docker-proxy: TCP accept with no
# Postgres handshake (host `psql`/`sqlx` hang while `docker exec psql` works).
# GitLab CI uses the `postgres` service alias on 5432, not this file.
services:
  postgres:
    image: postgres:16-alpine
    network_mode: host
    environment:
      POSTGRES_USER: voting
      POSTGRES_PASSWORD: voting
      POSTGRES_DB: voting_test_local
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=trust"
      PGPORT: "5433"
    volumes:
      - ./deploy/tests/mark-test-database.sql:/docker-entrypoint-initdb.d/mark-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voting -d voting_test_local -p 5433"]
      interval: 2s
      timeout: 5s
      retries: 20
