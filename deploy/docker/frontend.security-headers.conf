# Included from frontend.nginx.conf. Docker substitutes the __*_ORIGIN__ tokens.
# Invariant O3 / Legal C6: connect-src lists explicit origins — no blanket https:.
# Issue #12: WalletConnect needs frame-src (Reown/wagmi QR iframe) and WC img-src.
# AppKit 1.7.8 fetches https://api.web3modal.org (config, wallets). CSP host
# `*.web3modal.com` does not match the `.org` TLD — list both. Firefox also
# needs explicit wss://relay.walletconnect.org (wildcard can fail the QR).
# Do not add `connect-src https:` or `frame-src *`. Keep frame-ancestors 'none'.
# See docs/OPS.md, docs/FRONTEND.md, skills/AGENTS_LEGAL_CLICKWRAP.md,
# skills/AGENTS_WALLET_CONNECTORS.md.

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-NzvNrqk5jB9YZATwo5BF4JoRlJ02HsnFikbKXgEPdaQ='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.walletconnect.com https://*.walletconnect.org https://explorer-api.walletconnect.com https://*.web3modal.com https://api.web3modal.com https://api.web3modal.org; font-src 'self' data: https://fonts.gstatic.com https://fonts.reown.com; connect-src 'self' __OPERATOR_ORIGIN__ __LEGAL_API_ORIGIN__ __LEGAL_TERMS_ORIGIN__ https://terra-classic-lcd.publicnode.com https://terra-classic-rpc.publicnode.com https://terra-classic-rpc.publicnode.com:443 https://*.walletconnect.com https://*.walletconnect.org wss://*.walletconnect.com wss://*.walletconnect.org https://rpc.walletconnect.com https://rpc.walletconnect.org https://relay.walletconnect.com https://relay.walletconnect.org wss://relay.walletconnect.com wss://relay.walletconnect.org https://explorer-api.walletconnect.com https://pulse.walletconnect.com https://pulse.walletconnect.org https://verify.walletconnect.com https://verify.walletconnect.org https://*.reown.com https://*.web3modal.com https://*.web3modal.org https://api.web3modal.com https://api.web3modal.org https://keys.walletconnect.com https://keys.walletconnect.org https://notify.walletconnect.com https://notify.walletconnect.org https://echo.walletconnect.com https://echo.walletconnect.org https://push.walletconnect.com https://push.walletconnect.org wss://www.walletlink.org https://cca-lite.coinbase.com https://walletconnect.luncdash.com wss://walletconnect.luncdash.com; frame-src 'self' https://verify.walletconnect.com https://verify.walletconnect.org https://secure.walletconnect.com https://secure.walletconnect.org https://*.walletconnect.com https://*.walletconnect.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
