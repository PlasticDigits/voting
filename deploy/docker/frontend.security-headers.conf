# Included from frontend.nginx.conf. Docker substitutes the __*_ORIGIN__ tokens.
# Invariant O3 / Legal C6: connect-src lists explicit origins — no blanket https:.
# See docs/OPS.md, docs/FRONTEND.md, skills/AGENTS_LEGAL_CLICKWRAP.md.

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' __OPERATOR_ORIGIN__ __LEGAL_API_ORIGIN__ __LEGAL_TERMS_ORIGIN__ https://terra-classic-lcd.publicnode.com https://terra-classic-rpc.publicnode.com https://terra-classic-rpc.publicnode.com:443 https://*.walletconnect.com https://*.walletconnect.org wss://*.walletconnect.com wss://*.walletconnect.org https://rpc.walletconnect.com https://relay.walletconnect.com wss://relay.walletconnect.com https://explorer-api.walletconnect.com https://pulse.walletconnect.org https://*.reown.com https://*.web3modal.com https://cca-lite.coinbase.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
