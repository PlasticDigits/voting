# Voting dApp static host. Build context substitutes CSP origins via
# deploy/docker/frontend.security-headers.conf. See docs/OPS.md (O3) and
# skills/AGENTS_LEGAL_CLICKWRAP.md (CSP C6).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/voting-security-headers.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/voting-security-headers.conf;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/voting-security-headers.conf;
        try_files $uri =404;
    }
}
