# Voting dApp static host. Build context substitutes CSP origins via
# deploy/docker/frontend.security-headers.conf. See docs/OPS.md (O3, O8) and
# skills/AGENTS_LEGAL_CLICKWRAP.md (CSP C6, Legal return).
#
# Invariant O8: GET /, /vote, /new, /vote/new, /vote/:id, /:id must return
# 200 text/html (this server block's try_files → index.html). Missing hashed
# assets must stay 404. Do not use error_page 404 = index.html (caches 404).
# Coolify must use this file (frontend.Dockerfile) or stamp the same try_files
# on the actual edge — a parent proxy that 404s /vote before nginx still breaks
# Legal Accept. Prove with curl, not client-side <Link>.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/voting-security-headers.conf;

    # Vite hashed bundles. ^~ skips the extension regex and never SPA-fallbacks.
    location ^~ /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/voting-security-headers.conf;
        try_files $uri =404;
    }

    # App routes have no files on disk. $uri/ is omitted so a missing directory
    # is not an internal redirect to /vote/ before fallback.
    location / {
        try_files $uri /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/voting-security-headers.conf;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/voting-security-headers.conf;
        try_files $uri =404;
    }
}
