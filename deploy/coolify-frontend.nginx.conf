# Coolify "Custom Nginx Configuration" for a *static* dApp deploy.
# Paste this in place of Coolify's default static server block.
#
# Why: Vite only emits index.html. Routes /, /new, /:id and /vote* aliases live
# in React Router. Coolify's default try_files … =404 404s those paths on a full
# document GET (Legal portal return, WalletConnect return, refresh, shared link).
# In-app <Link> navigation never hits nginx, so it looks fine until a redirect.
#
# Preferred: deploy deploy/docker/frontend.Dockerfile instead. That image already
# uses try_files $uri /index.html, stamps CSP from frontend.security-headers.conf,
# and HEALTHCHECKs /vote and /new. Do not overlay this Coolify static nginx on
# top of that container.
#
# O8: GET /, /vote, /new, /vote/new, /vote/:id, /:id → 200 HTML.
# Missing /assets/* stay 404. $uri/ is omitted so /vote is not an internal
# redirect to /vote/ before fallback. Do not use error_page 404 = /index.html.
#
# O3 / Legal C6: this pasteable block *must* send CSP (no blanket https:) because
# Coolify's stock static nginx (often 1.31.x) has no repo snippets. Live
# vote.cl8y.com used this path without headers until this file gained them.
# connect-src origins below match production:
#   operator.vote.cl8y.com · api.terms.cl8y.com · terms.cl8y.com
# Edit those three if a staging host differs. Keep aligned with
# deploy/docker/frontend.security-headers.conf. Do not add `connect-src https:`.
#
# Nested locations must not call add_header (nginx would drop the server-level
# CSP / X-Frame-Options). `expires` is fine; Cache-Control add_header is not.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://operator.vote.cl8y.com https://api.terms.cl8y.com https://terms.cl8y.com https://terra-classic-lcd.publicnode.com https://terra-classic-rpc.publicnode.com https://terra-classic-rpc.publicnode.com:443 https://*.walletconnect.com https://*.walletconnect.org wss://*.walletconnect.com wss://*.walletconnect.org https://rpc.walletconnect.com https://relay.walletconnect.com wss://relay.walletconnect.com https://explorer-api.walletconnect.com https://pulse.walletconnect.org https://*.reown.com https://*.web3modal.com https://cca-lite.coinbase.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location ^~ /assets/ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }
}
